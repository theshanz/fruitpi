; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
src_dir = main
include_dir = main

[env:esp32cam]
platform = espressif32
board = esp32cam
framework = arduino
extra_scripts = post:extra_script.py
build_flags =
	-DBOARD_HAS_PSRAM
	-DCONFIG_BT_NIMBLE_HOST_TASK_STACK_SIZE=8192
board_build.arduino.memory_type = qio_qspi
board_build.partitions = huge_app.csv
monitor_speed = 115200
lib_deps =
	bblanchon/ArduinoJson@^6.21.5
	h2zero/NimBLE-Arduino@^1.4.2
	marcoschwartz/LiquidCrystal_I2C@^1.1.4
build_src_filter = +<*>

[env:esp32s3cam]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
extra_scripts = post:extra_script.py
build_flags =
	-DBOARD_HAS_PSRAM
	-DCONFIG_BT_NIMBLE_HOST_TASK_STACK_SIZE=8192
	; loopTask's stack was overflowing on the first captured tap: the tap
	; quality gate and the 512-sample window arrays are now static, but the
	; loop's own frame (printf, the model blob, the display buffers) still
	; needs more than the default 8 KB.  The macro is #ifndef-guarded in the
	; Arduino core, so it can be raised here.
	-DARDUINO_LOOP_STACK_SIZE=16384
board_build.arduino.memory_type = qio_opi
board_build.partitions = huge_app.csv
monitor_speed = 115200
lib_deps =
	bblanchon/ArduinoJson@^6.21.5
	h2zero/NimBLE-Arduino@^1.4.2
	marcoschwartz/LiquidCrystal_I2C@^1.1.4
build_src_filter = +<*>
upload_port = /dev/ttyUSB0
upload_speed = 460800
